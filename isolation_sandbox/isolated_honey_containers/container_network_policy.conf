# ==============================================================================
# Isolated Honey Container Network Quarantine & Egress Containment Policy
# Network: sandbox_containment_net (172.29.0.0/24, internal: true)
# ==============================================================================

[containment_topology]
network_name = sandbox_containment_net
subnet_cidr = 172.29.0.0/24
gateway_bridge_ip = 172.29.0.1
air_gapped_internal = true
allow_internet_egress = false
allow_production_db_access = false
allow_lateral_container_icmp = false

[ingress_rules]
# Only allow reverse-proxied HTTP traffic from deception_gateway on port 8080
allow_ingress_tcp_ports = 8080
allowed_source_cidr = 172.29.0.0/24
drop_unmatched_ingress = true

[egress_quarantine_rules]
# Block all real outbound connections (Reverse Shells, C2 callbacks, exfiltration)
default_egress_policy = DROP_AND_INTERCEPT
sinkhole_dns_queries = true
sinkhole_http_https_c2 = true
intercept_ports = 21,22,23,25,53,80,443,1337,4444,5555,6667,8080,8443,9001

[resource_quotas]
max_cpu_cores = 0.50
max_memory_mb = 256
max_pids = 64
max_requests_per_minute = 120
drop_linux_capabilities = ALL
no_new_privileges = true
