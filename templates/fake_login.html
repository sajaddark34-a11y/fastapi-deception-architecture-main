<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Secure Portal</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            padding: 2.2rem;
        }
        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: #0ea5e9;
            color: #f8fafc;
            box-shadow: 0 0 0 0.25rem rgba(14, 165, 233, 0.25);
        }
        .btn-primary {
            background-color: #0ea5e9;
            border-color: #0ea5e9;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #0284c7;
            border-color: #0284c7;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <h3 class="fw-bold tracking-tight">Employee Secure Portal</h3>
            <p class="text-secondary small mb-0">Authorized Internal Access Only</p>
        </div>

        <!-- Error Message Display Section -->
        {% if error %}
        <div class="alert alert-danger py-2 small d-flex align-items-center" role="alert">
            <svg class="bi flex-shrink-0 me-2" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M7.938 2.016A.13.13 0 0 1 8.002 2a.13.13 0 0 1 .063.016.146.146 0 0 1 .054.057l6.857 11.667c.036.06.035.124.002.183a.163.163 0 0 1-.054.06.116.116 0 0 1-.066.017H1.146a.115.115 0 0 1-.066-.017.163.163 0 0 1-.054-.06.176.176 0 0 1 .002-.183L7.884 2.073a.147.147 0 0 1 .054-.057zm1.044-.45a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566z"/>
                <path d="M7.002 12a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 5.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995z"/>
            </svg>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        <!-- Web Honeypot Decoy Form -->
        <form method="POST" action="/login">
            <div class="mb-3">
                <label for="username" class="form-label small text-secondary">Username or Corporate ID</label>
                <input type="text" class="form-control" id="username" name="username" required autocomplete="off" placeholder="e.g. jdoe_internal">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label small text-secondary">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
        </form>

        <div class="text-center mt-4">
            <small class="text-muted" style="font-size: 11px;">Notice: All access attempts are cryptographically verified and monitored.</small>
        </div>
    </div>
</body>
</html>
